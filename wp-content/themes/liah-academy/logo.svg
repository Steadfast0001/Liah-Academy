<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients and clipping paths -->
  <defs>
    <!-- Gold gradient for shields, book, and wreaths -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="50%" stop-color="#F8B646" />
      <stop offset="100%" stop-color="#E28704" />
    </linearGradient>
    <!-- Background circle shadow filter for premium feel -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <shadowOffset dx="0" dy="4"/>
      <shadowStdDeviation stdDeviation="4"/>
      <shadowColor rgba="0, 0, 0, 0.15"/>
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="250" cy="250" r="235" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Navy circular track for name -->
  <path id="textTrack" d="M 65 250 A 185 185 0 0 1 435 250" fill="none" stroke="#081F3E" stroke-width="36" stroke-linecap="butt" />

  <!-- LIAH ACADEMY text along path -->
  <text font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="25" fill="#F8FAFC" letter-spacing="4">
    <textPath href="#textTrack" startOffset="50%" text-anchor="middle">LIAH ACADEMY</textPath>
  </text>

  <!-- Wreaths / Wheat ears (Left & Right curves) -->
  <g fill="url(#goldGrad)">
    <!-- Left Wreath -->
    <path d="M 125,320 C 130,350 150,385 190,410 C 192,411 190,415 188,414 C 145,385 125,340 120,320 Z" />
    <!-- Left leaves -->
    <path d="M 124,328 C 115,322 108,312 112,305 C 116,303 124,310 128,320 Z" />
    <path d="M 129,343 C 120,335 112,326 117,318 C 122,315 129,325 131,335 Z" />
    <path d="M 136,360 C 127,351 119,340 125,333 C 131,330 137,341 138,351 Z" />
    <path d="M 146,375 C 137,366 128,356 135,348 C 141,346 148,357 148,367 Z" />
    <path d="M 158,389 C 149,380 141,370 148,362 C 154,359 160,371 160,381 Z" />
    <path d="M 172,400 C 163,392 156,381 163,374 C 169,371 175,382 174,392 Z" />
    <path d="M 188,409 C 180,401 173,391 179,384 C 185,381 191,391 190,401 Z" />

    <!-- Right Wreath -->
    <path d="M 375,320 C 370,350 350,385 310,410 C 308,411 310,415 312,414 C 355,385 375,340 380,320 Z" />
    <!-- Right leaves -->
    <path d="M 376,328 C 385,322 392,312 388,305 C 384,303 376,310 372,320 Z" />
    <path d="M 371,343 C 380,335 388,326 383,318 C 378,315 371,325 369,335 Z" />
    <path d="M 364,360 C 373,351 381,340 375,333 C 369,330 363,341 362,351 Z" />
    <path d="M 354,375 C 363,366 372,356 365,348 C 359,346 352,357 352,367 Z" />
    <path d="M 342,389 C 351,380 359,370 352,362 C 346,359 340,371 340,381 Z" />
    <path d="M 328,400 C 337,392 344,381 337,374 C 331,371 325,382 326,392 Z" />
    <path d="M 312,409 C 320,401 327,391 321,384 C 315,381 309,391 310,401 Z" />
  </g>
  
  <!-- Ribbon Join/Divider at bottom -->
  <circle cx="250" cy="405" r="5" fill="#E28704" />
  <line x1="250" y1="400" x2="250" y2="425" stroke="#E28704" stroke-width="3" />

  <!-- Arched Gate above the shield (Greek-inspired Columns & Arch) -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <path d="M 180,180 A 70,70 0 0,1 320,180" stroke-width="3" />
    <path d="M 183,185 A 67,67 0 0,1 317,185" stroke-width="1" />
    <!-- Vertical gate bars -->
    <line x1="190" y1="180" x2="190" y2="200" />
    <line x1="200" y1="172" x2="200" y2="200" />
    <line x1="210" y1="166" x2="210" y2="200" />
    <line x1="220" y1="162" x2="220" y2="200" />
    <line x1="230" y1="159" x2="230" y2="200" />
    <line x1="240" y1="157" x2="240" y2="200" />
    <line x1="250" y1="156" x2="250" y2="200" />
    <line x1="260" y1="157" x2="260" y2="200" />
    <line x1="270" y1="159" x2="270" y2="200" />
    <line x1="280" y1="162" x2="280" y2="200" />
    <line x1="290" y1="166" x2="290" y2="200" />
    <line x1="300" y1="172" x2="300" y2="200" />
    <line x1="310" y1="180" x2="310" y2="200" />
  </g>

  <!-- Central Shield -->
  <g filter="url(#dropShadow)">
    <path d="M 170,200 L 330,200 L 330,290 C 330,325 295,355 250,370 C 205,355 170,325 170,290 Z" fill="#081F3E" stroke="url(#goldGrad)" stroke-width="5" />
    <path d="M 178,208 L 322,208 L 322,286 C 322,316 292,344 250,358 C 208,344 178,316 178,286 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- SINCE 2024 Header text in shield -->
  <text x="250" y="226" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F5A623" text-anchor="middle" letter-spacing="2">SINCE 2024</text>
  <line x1="190" y1="233" x2="310" y2="233" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Open Book Icon in the Shield -->
  <g transform="translate(202, 245)">
    <path d="M 5,30 C 20,20 40,25 45,28 C 50,25 70,20 90,30 L 90,10 C 70,0 50,5 48,7 C 46,5 26,0 6,10 Z" fill="url(#goldGrad)" />
    <path d="M 46,7 L 46,31" stroke="#081F3E" stroke-width="2" />
    <path d="M 14,13 C 24,7 36,9 41,12" stroke="#081F3E" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M 14,18 C 24,12 36,14 41,17" stroke="#081F3E" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M 14,23 C 24,17 36,19 41,22" stroke="#081F3E" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M 82,13 C 72,7 60,9 55,12" stroke="#081F3E" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M 82,18 C 72,12 60,14 55,17" stroke="#081F3E" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M 82,23 C 72,17 60,19 55,22" stroke="#081F3E" stroke-width="1.2" fill="none" opacity="0.6" />
  </g>

  <!-- LA Initials inside Chevron Banner -->
  <g transform="translate(190, 310)">
    <text x="60" y="20" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">LA</text>
    <line x1="15" y1="20" x2="35" y2="20" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="85" y1="20" x2="105" y2="20" stroke="url(#goldGrad)" stroke-width="2" />
  </g>
</svg>
